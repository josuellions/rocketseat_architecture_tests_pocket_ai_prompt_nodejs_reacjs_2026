name: CI (Integration continues)
on: [pull_request]

jobs:
  build:
    name: Validate the code and generate a build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prompt-manager-architecture-dev?schema=public

    steps:
      - name: checkout to repository
        uses: actions/checkout@v4

      - name: configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: generate prisma customer
        run: pnpm services:prisma:create

      - name: verify code standardization (eslint)
        run: pnpm lint:eslint:check

      - name: verify standardization typing (TypeScript)
        run: pnpm lint:type:check

      - name: run unit tests (Jest)
        run: pnpm test:coverage

      - name: generate final build
        run: pnpm build
